[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "vtuber-digest"
version = "0.1.0"
description = "Automated Map-Reduce LLM Summarization Pipeline & Observability Engine for VTuber streams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "yt-dlp>=2024.3.10",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3",
    "google-cloud-storage>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "B008",   # Depends in FastAPI argument defaults
    "BLE001",  # Catching blind Exception in try-except loggers
    "DTZ003",  # utcnow() in datetime models
    "SIM102",  # Nested if statements
    "E501",    # Line length
    "W293"     # Whitespace on blank lines
]
