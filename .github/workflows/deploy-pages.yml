name: Deploy VTuber Digest to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Single source of truth for Pages deploys. Both this workflow and
# ingest-stream.yml publish via the GitHub Actions artifact flow (NOT a
# gh-pages branch), so set repo Settings -> Pages -> Source = "GitHub Actions".
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  GCS_BUCKET_NAME: vtuber-summaries

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_VERTEX_SA_KEY }}

      # Pull the persisted DB so we export real summaries instead of rebuilding
      # from an empty database (which is what was wiping the live dashboard).
      - name: Restore summary DB from GCS
        run: |
          uv run python -m scratch.db_sync pull

      - name: Export Static Site & Summaries
        run: |
          uv run python -m scratch.export_static_gh_pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
